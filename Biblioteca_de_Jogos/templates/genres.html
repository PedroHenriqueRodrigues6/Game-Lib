{% extends "base.html" %}{% block title %}Gêneros{% endblock %}{% block content %}<div class="columns"><section class="formbox"><h2>Novo gênero</h2><form method="post"><label>Nome<input name="name" required placeholder="Ex.: Plataforma"></label><button class="btn">Cadastrar gênero</button></form></section><section class="formbox"><h2>Gêneros cadastrados</h2>{% for g in genres %}<div class="genre"><div><b>{{g.name}}</b><small>{{g.game_count}} jogo(s)</small></div><form method="post" action="/genres/{{g.id}}/delete"><button class="link danger">Excluir</button></form></div>{% endfor %}</section></div>{% endblock %}
