{% extends "base.html" %}{% block title %}{{'Editar jogo' if game else 'Cadastrar jogo'}}{% endblock %}{% block content %}<div class="formbox"><form method="post"><label>Título<input name="title" required value="{{game.title if game else ''}}"></label><div class="two"><label>Plataforma<input name="platform" required placeholder="Ex.: PlayStation 5" value="{{game.platform if game else ''}}"></label><label>Ano de lançamento<input type="number" name="release_year" min="1970" max="2100" value="{{game.release_year if game and game.release_year else ''}}"></label></div><div class="two"><label>Gênero<select name="genre_id" required>{% for g in genres %}<option value="{{g.id}}" {% if game and game.genre_id==g.id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></label><label>Status<select name="status"><option {% if not game or game.status=='Disponível' %}selected{% endif %}>Disponível</option><option {% if game and game.status=='Emprestado' %}selected{% endif %}>Emprestado</option></select></label></div><div class="buttons"><a class="btn secondary" href="/">Cancelar</a><button class="btn">Salvar jogo</button></div></form></div>{% endblock %}
